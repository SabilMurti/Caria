[package]
name = "caria_runtime"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["staticlib", "rlib"]

[dependencies]
tokio = { version = "1.34", features = ["full"] }
caria_memory = { path = "../caria_memory" }
argon2 = "0.5.3"
mysql_async = { version = "0.34.0", default-features = false }
serde_json = "1.0.108"
lazy_static = "1.4.0"
rand = "0.8.5"
tungstenite = "0.20.1"
tokio-tungstenite = "0.20.1"
axum = "0.7.5"
aes-gcm = "0.10.3"
redis = "0.25.3"
dotenvy = "0.15.7"
base64 = "0.22.1"
flate2 = { version = "1.1.9", default-features = false, features = ["rust_backend"] }
hmac = "0.12.1"
sha2 = "0.10.8"
regex = "1.10"
rsa = "0.9"
ed25519-dalek = { version = "2.1", features = ["rand_core"] }
hex = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
url = "2.5"
zip = "0.6"
tar = "0.4"
rusqlite = { version = "0.32", features = ["bundled"] }
parking_lot = "0.12"
chrono = "0.4"
libc = "0.2"
crossbeam-channel = "0.5"
