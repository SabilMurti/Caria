[package]
name = "caria_runtime"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["staticlib", "rlib"]

[dependencies]
tokio = { version = "1.34", features = ["full"] }
caria_memory = { path = "../caria_memory" }
argon2 = "0.5.3"
mysql_async = { version = "0.34.0", default-features = false }
serde_json = "1.0.108"
lazy_static = "1.4.0"
rand = "0.8.5"
tungstenite = "0.20.1"
tokio-tungstenite = "0.20.1"
axum = "0.7.5"
aes-gcm = "0.10.3"
redis = "0.25.3"
dotenvy = "0.15.7"
base64 = "0.22.1"
flate2 = { version = "1.1.9", default-features = false, features = ["rust_backend"] }
