name: Caria - Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    name: Release Caria (${{ matrix.os }})
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            artifact: caria_cli-linux-x86_64
          - os: macos-latest
            artifact: caria_cli-macos-x86_64
          - os: windows-latest
            artifact: caria_cli-windows-x86_64.exe
    runs-on: ${{ matrix.os }}
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
      
      - name: Build Release
        run: cargo build --release
      
      - name: Prepare binary name
        shell: bash
        run: |
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            cp target/release/caria_cli.exe "${{ matrix.artifact }}"
          else
            cp target/release/caria_cli "${{ matrix.artifact }}"
          fi
      
      - name: Upload Release Asset
        uses: softprops/action-gh-release@v1
        with:
          files: |
            ${{ matrix.artifact }}
          generate_release_notes: true
          token: ${{ secrets.GITHUB_TOKEN }}
