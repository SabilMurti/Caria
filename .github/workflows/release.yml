name: Release Caria

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  release:
    name: Build & Release Caria (Linux)
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
      
      - name: Build Release
        run: cargo build --release
      
      - name: Prepare Artifact
        run: |
          mkdir -p dist
          cp target/release/caria_cli dist/caria
          
      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-binary
          path: dist/caria
          retention-days: 90
          
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: dist/caria
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
