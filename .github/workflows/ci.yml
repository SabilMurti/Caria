name: Caria - Build & Test

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: Build & Test
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      
      - name: Cache Cargo
        uses: actions/cache@v3
        with:
          path: |
            ~/.cargo/registry
            target
          key: ${{ runner.os }}-caria-${{ hashFiles('**/Cargo.lock') }}
      
      - name: Build
        run: cargo build --release
      
      - name: Run tests
        run: cargo test --verbose
      
      - name: Lint
        run: cargo clippy -- -D warnings
      
      - name: Check formatting
        run: cargo fmt --check
      
      - name: Upload binary
        uses: actions/upload-artifact@v3
        with:
          name: caria_cli-${{ matrix.os }}
          path: target/release/caria_cli
          retention-days: 7
